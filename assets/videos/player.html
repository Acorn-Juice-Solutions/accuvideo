<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccuVideo video player</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07111f;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
    }
    .wrap {
      width: min(960px, 100vw);
      padding: 1rem;
      box-sizing: border-box;
    }
    video {
      width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="player" controls preload="metadata" playsinline></video>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const video = params.get('video') || 'demo-en.mp4';
    const player = document.getElementById('player');
    const videoUrl = new URL(video, window.location.href).href;
    player.src = videoUrl;
    player.load();
  </script>
</body>
</html>
